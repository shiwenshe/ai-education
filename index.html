function start(){i=0;sc={};sel=[];question();}
function isMulti(q){return q[2]==='multi';}
function question(){var q=Q[i],multi=isMulti(q),h='<div class="card"><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><p class="qn">第 '+(i+1)+' / '+Q.length+' 题</p><p class="q">'+q[0]+'</p>';if(multi){sel=[];h+='<p class="hint">多选 · 最多选 '+MULTI_CAP+' 项</p>';for(var x=0;x<q[1].length;x++){h+='<button class="opt" id="opt'+x+'" onclick="toggle('+x+')">'+q[1][x][0]+'</button>';}h+='<button class="btn" id="nextbtn" disabled onclick="nextMulti()">下一题 →</button>';}else{for(var y=0;y<q[1].length;y++){h+='<button class="opt" onclick="pick('+y+')">'+q[1][y][0]+'</button>';}}h+='</div>';app.innerHTML=h;window.scrollTo(0,0);}
function pick(x){var m=Q[i][1][x][1];for(var k in m){sc[k]=(sc[k]||0)+m[k];}i++;if(i<Q.length)question();else show();}
function toggle(x){var pos=sel.indexOf(x);if(pos>-1){sel.splice(pos,1);}else{if(sel.length>=MULTI_CAP)return;sel.push(x);}refreshMulti();}
function refreshMulti(){var q=Q[i],full=sel.length>=MULTI_CAP;for(var x=0;x<q[1].length;x++){var el=document.getElementById('opt'+x),on=sel.indexOf(x)>-1;el.className='opt'+(on?' on':'')+((!on&&full)?' dis':'');el.disabled=(!on&&full);}document.getElementById('nextbtn').disabled=sel.length<1;}
function nextMulti(){if(sel.length<1)return;var q=Q[i];for(var s=0;s<sel.length;s++){var m=q[1][sel[s]][1];for(var k in m){sc[k]=(sc[k]||0)+m[k];}}sel=[];i++;if(i<Q.length)question();else show();}
function show(){var b=result(),p=P[b],r=RAR[p.r];var pic=IMG[p.n]?'<div class="picwrap"><img src="'+IMG[p.n]+'" alt="'+p.n+'"></div>':'';app.innerHTML='<div class="card"><div class="bar"><i style="width:100%"></i></div><span class="badge" style="color:'+r[1]+';background:'+r[2]+'">'+r[0]+'同学</span>'+pic+'<p class="ailead">你的 AiTi 是</p><p class="rname">'+p.n+'</p><p class="rone">'+p.one+'</p><p class="dir">推荐大方向：'+p.dir+'</p><div class="row"><p class="k">你的优势</p><p class="v">'+p.adv+'</p></div><div class="row"><p class="k">要小心</p><p class="v">'+p.risk+'</p></div><div class="row"><p class="k">你的第一份作业</p><p class="v">'+p.hw+'</p></div><div class="row"><p class="k">建议课程路线</p><p class="v">'+p.route+'</p></div><div style="height:18px"></div><a class="btn cta" href="#">按你这型，第一步该怎么走 →</a><p class="ctasub">道理跟健身一样——花钱请了私教，才真会去练。报个名，等于给自己请个『AI 督学』，有人盯着，你才真动手。</p><div style="height:12px"></div><button class="btn sec" onclick="intro()">重新测一次</button><p class="foot">截图甩群里，看看同事都是哪号选手 · 灵雨漱石 内测</p></div>';window.scrollTo(0,0);}
intro();
</script>
